<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login - Reboot</title>
</head>
<body>
    <div class="contenedorIzquierda">
        <h1>Inicio de Sesión</h1>
        <form class="containerForm" id="form-login">
            <div class="datosLogueo">
                <label for="email">Email: </label>
                <input type="email" id="email" placeholder="Ingrese su correo" required autocomplete="username">
                
                <label for="contrasena">Contraseña: </label>
                <input type="password" id="contrasena" placeholder="Ingrese su contraseña" required autocomplete="current-password">
                
                <small id="error-login"></small>
                
                <button type="submit" class="botones botones--iniciarSesion">Ingresar</button>
            </div>
            <div class="otrasOpciones">
                <p>¿No tiene una cuenta? <a href="register.html" class="registrese">Regístrese</a></p>
            </div>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
