<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard de REBOOT - Panel de control de tu entrenamiento personalizado">
    <title>Dashboard | REBOOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>

<body class="dashboard">
    <aside class="sidebar">
        <div class="sidebar__logo">
            <h1 class="sidebar__titulo">REBOOT</h1>
        </div>
        <nav class="sidebar__navegacion" id="sidebar-nav"></nav>
    </aside>
    <div class="dashboard__contenedor">
        <header class="navbar">
            <div class="navbar__info">
                <span class="navbar__rol" id="user-role"></span>
                <span class="navbar__usuario" id="user-name"></span>
            </div>
            <button class="botones boton--logout-dashboard" id="logout-btn" type="button">Cerrar Sesión</button>
        </header>
        <main class="vista-contenedor" id="dashboard-view">
            <section class="vista-placeholder">
                <h2>Bienvenido a Reboot</h2>
                <p>Selecciona una opción del menú para comenzar.</p>
            </section>
        </main>
    </div>
    <div id="modal-container" class="modal-overlay modal-overlay--hidden" role="dialog" aria-hidden="true"></div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
